[pytest]
markers =
    verification: SPICE / characterization / RTL verification regression gates
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    --cov=tests
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml
    --cov-fail-under=99
