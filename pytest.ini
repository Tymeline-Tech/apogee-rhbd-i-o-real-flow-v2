[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    verification: RTL/Icarus integration, SPICE reference compare, and functional coverage (≥99%, ≤1% deviation)
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
